    <link rel="stylesheet" href="../ASSETS/CSS/cadastroEmpresa.css">
</head>
<body>
    <button id="menu-btn">☰</button>

    <nav id="menu" class="menu">
        <ul>

            <li><a href="biblioteca.html">Biblioteca</a></li>

            <li><a href="cadastroCliente.html">Cadastro</a></li>
            <li><a href="suporte.html">Suporte</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="logo-container">
            <img src="../ASSETS/IMG/logo.png.png" alt="Ghost Gamer" class="logo-img">
            <span class="logo-text"><a href="../index.html">GHOST GAMER</a></span>
        </div>

        <!-- Apenas Cadastro Form - Centralizado -->
        <div class="cadastro-wrapper">
            <div class="form-box cadastro-box">
                <h2>CADASTRO</h2>
                <form>
                    <div class="input-group">
                        <label>Razão Social</label>
                        <input type="text" placeholder="Digite o nome da Empresa">
                    </div>
                    <div class="input-group">
                        <label>CNPJ</label>
                        <input type="text" placeholder="Digite o CNPJ da Empresa">
                    </div>
                    <div class="input-group">
                        <label>Data de abertura</label>
                        <input type="text" placeholder="Digite o CNPJ da Empresa">
                    </div>
                    <div class="input-group">
                        <label>CIdade</label>
                        <input type="text" placeholder="Digite o CNPJ da Empresa">
                    </div>
                    <div class="input-group">
                        <label>Estado</label>
                        <input type="text" placeholder="Digite o CNPJ da Empresa">
                    </div>
                    <div class="input-group">
                        <label>CEP</label>
                        <input type="text" placeholder="Digite o CNPJ da Empresa">
                    </div>
                    <div class="input-group">
                        <label>Telefone de contato</label>
                        <input type="text" placeholder="Digite o CNPJ da Empresa">
                    </div>
                    <div class="input-group">
                        <label>E-mail de contato</label>
                        <input type="email" placeholder="Digite o CNPJ da Empresa">
                    </div><div class="input-group">
                        <label>Site oficial (Opcional)</label>
                        <input type="text" placeholder="Digite o CNPJ da Empresa">
                    </div>
                    
                    
                    <button type="submit" class="btn-cadastro">CRIAR EMPRESA</button>
                    
                </form>
            </div>
        </div>
    </div>

    <script src="../ASSETS/JS/index.js"></script>
</body>
</html>
