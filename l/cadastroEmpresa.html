<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Empresa</title>
</head>
<body>

<h2>Cadastro de Empresa</h2>

<form method="post" action="cadastroEmpresa.php">

    Razão Social:<br>
    <input type="text" name="razao_social" maxlength="155" required><br><br>

    Nome Fantasia:<br>
    <input type="text" name="nome_fantasia" maxlength="150" required><br><br>

    CNPJ (somente números):<br>
    <input type="text" name="cnpj" maxlength="14" required><br><br>

    Data de Abertura:<br>
    <input type="date" name="data_abertura"><br><br>

    Telefone:<br>
    <input type="text" name="telefone" maxlength="14"><br><br>

    Email:<br>
    <input type="email" name="email" maxlength="255" required><br><br>

    Rua:<br>
    <input type="text" name="rua" maxlength="100"><br><br>

    Número:<br>
    <input type="text" name="numero" maxlength="10"><br><br>

    Bairro:<br>
    <input type="text" name="bairro" maxlength="80"><br><br>

    Cidade:<br>
    <input type="text" name="cidade" maxlength="100"><br><br>

    Estado (sigla, ex: SP):<br>
    <input type="text" name="estado" maxlength="2"><br><br>

    CEP (somente números):<br>
    <input type="text" name="cep" maxlength="8"><br><br>

    País (código, ex: BR):<br>
    <input type="text" name="pais" maxlength="2"><br><br>

    <button type="submit">Cadastrar</button>

</form>

</body>
</html>
